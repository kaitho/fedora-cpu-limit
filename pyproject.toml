[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fedora-cpu-limit"
version = "0.3.0"
description = "KDE-friendly GUI for limiting CPU performance on Fedora Linux"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Kai Erik Thoresen" }]
dependencies = ["PySide6>=6.7"]

[project.scripts]
fedora-cpu-limit = "fedora_cpu_limit.app:main"

[tool.setuptools.packages.find]
where = ["src"]
